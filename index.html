// ─── FATIMA DIALOG ────────────────────────────────────────────────────────────
function FatimaDialog({ mensaje, tipo }) {
  if (!mensaje) return null;
  const ok = tipo === "acierto" || tipo === "victoria" || tipo === "intro";
  return (
    <div className={`flex gap-3 items-start rounded-2xl border-2 px-4 py-4 backdrop-blur-sm shadow-lg fade-in ${ok ? "border-cyan-400 bg-cyan-950/80" : "border-amber-400 bg-amber-950/80"}`}>
      <div className={`shrink-0 w-11 h-11 rounded-full border-2 flex items-center justify-center text-xl font-black bg-cyan-950/60 ${ok ? "border-cyan-400 text-cyan-300" : "border-amber-400 text-amber-300"}`}>F</div>
      <div>
        <p className={`text-xs uppercase tracking-widest font-bold mb-1 ${ok ? "text-cyan-400" : "text-amber-400"}`}>Maestra Fatima</p>
        <p className={`text-xl leading-snug ${ok ? "text-cyan-100" : "text-amber-100"}`}>{mensaje}</p>
      </div>
    </div>
  );
}

// ─── MODAL DE PENALIZACION ────────────────────────────────────────────────────
function ModalError({ mensaje, onReiniciar }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" role="alertdialog">
      <div className="absolute inset-0 bg-cyan-950/92" style={{backdropFilter:"blur(4px)"}} />
      <div className="relative z-10 w-full max-w-lg flex flex-col gap-6 bg-cyan-950/95 border-2 border-amber-500 rounded-3xl p-8 shadow-2xl fade-in">
        <div className="text-center">
          <p className="text-3xl font-black text-amber-400 uppercase tracking-wide">La magia se ha desestabilizado</p>
          <div className="mt-3 h-px" style={{background:"linear-gradient(to right, transparent, #f59e0b, transparent)"}} />
        </div>
        <div className="flex gap-4 items-start bg-amber-950/60 border-2 border-amber-500/70 rounded-2xl px-5 py-4">
          <div className="shrink-0 w-12 h-12 rounded-full border-2 border-amber-400 flex items-center justify-center text-2xl font-black text-amber-300 bg-cyan-950/60">F</div>
          <div>
            <p className="text-xs font-bold uppercase tracking-widest text-amber-400 mb-1">Maestra Fatima</p>
            <p className="text-xl leading-snug text-amber-100">{mensaje}</p>
          </div>
        </div>
        <button onClick={onReiniciar}
          className="w-full bg-amber-600 hover:bg-amber-500 border-2 border-amber-400 rounded-2xl py-4 text-2xl font-black text-white uppercase tracking-widest transition-all active:scale-95"
          style={{boxShadow:"0 0 20px rgba(245,158,11,.35)"}}>
          Volver a empezar la zona
        </button>
      </div>
    </div>
  );
}

// ─── INDICADOR DE FASES ───────────────────────────────────────────────────────
function IndicadorFases({ faseActual }) {
  const fases = ["Valvulas","Nenufares","Nectar","Jarras"];
  return (
    <div className="flex items-center justify-center gap-1 flex-wrap">
      {fases.map((nombre, i) => {
        const n = i + 1;
        const done = n < faseActual;
        const active = n === faseActual;
        return (
          <div key={n} className="flex items-center gap-1">
            <div className="flex flex-col items-center">
              <div className={`w-9 h-9 rounded-full border-2 flex items-center justify-center text-lg font-black transition-all ${done ? "bg-emerald-600 border-emerald-400 text-white" : active ? "bg-cyan-700 border-cyan-300 text-white" : "bg-cyan-950/60 border-cyan-800 text-cyan-700"}`}
                style={active ? {boxShadow:"0 0 10px rgba(0,220,240,.6)"} : {}}>
                {done ? "+" : n}
              </div>
              <span className={`text-xs mt-0.5 ${done?"text-emerald-400":active?"text-cyan-300":"text-cyan-800"}`}>{nombre}</span>
            </div>
            {i < 3 && <div className={`h-px w-6 mb-5 ${done?"bg-emerald-500":"bg-cyan-900"}`} />}
          </div>
        );
      })}
    </div>
  );
}

// ─── FASE 1 ───────────────────────────────────────────────────────────────────
function Fase1({ onComplete, onError }) {
  const [sel, setSel] = useState(null);
  const [fb, setFb] = useState({ msg: "Para abrir el paso de agua, necesitamos exactamente 0,5 litros. Que valvula de piedra fraccionaria encaja en este hueco?", tipo: "intro" });
  const [done, setDone] = useState(false);

  function pick(op) {
    if (done) return;
    setSel(op);
    if (op === "1/2") {
      setFb({ msg: "Valvula encajada! 0,5 y 1/2 son exactamente lo mismo. El agua empieza a fluir.", tipo: "acierto" });
      setDone(true);
      setTimeout(onComplete, 2200);
    } else {
      onError("Recuerda que 0,5 representa la mitad de una unidad entera. Que fraccion significa dividir algo en dos partes iguales? La magia se ha desestabilizado. Debes volver a empezar la zona desde el principio!");
    }
  }

  return (
    <div className="flex flex-col gap-5">
      <h2 className="text-2xl font-black text-cyan-200 text-center uppercase tracking-wide">Fase 1 — Las Valvulas Fraccionarias</h2>
      <div className="flex justify-center">
        <div className="border-2 border-cyan-600 bg-cyan-950/60 rounded-2xl px-10 py-5 text-center">
          <p className="text-cyan-400 text-lg uppercase tracking-widest">Decimal</p>
          <p className="text-6xl font-black text-white mt-1">0,5</p>
          <p className="text-cyan-400 text-lg">litros</p>
        </div>
      </div>
      <div className="grid grid-cols-3 gap-4">
        {["1/4","1/2","3/4"].map(op => (
          <button key={op} onClick={()=>pick(op)} disabled={done}
            className={`py-7 rounded-2xl border-2 text-4xl font-black transition-all active:scale-95 disabled:cursor-default ${sel===op && done ? "border-emerald-400 bg-emerald-900/60 text-emerald-200" : sel===op ? "border-amber-400 bg-amber-950/60 text-amber-200" : "border-cyan-700 bg-cyan-950/50 text-cyan-100 hover:border-cyan-400 hover:bg-cyan-900/60"}`}>
            {op}
          </button>
        ))}
      </div>
      <FatimaDialog mensaje={fb.msg} tipo={fb.tipo} />
    </div>
  );
}

// ─── FASE 2 ───────────────────────────────────────────────────────────────────
function Fase2({ onComplete, onError }) {
  const [val, setVal] = useState("");
  const [fb, setFb] = useState({ msg: "La Rana Guardiana pesa exactamente 1,5 kg. Debemos igualar su peso en gramos. Cuantos gramos colocamos?", tipo: "intro" });
  const [done, setDone] = useState(false);

  function comprobar() {
    if (done || !val) return;
    if (parseFloat(val) === 1500) {
      setFb({ msg: "Balanza equilibrada! 1500 gramos equivalen a 1,5 kg. La rana nos cede el paso.", tipo: "acierto" });
      setDone(true);
      setTimeout(onComplete, 2200);
    } else {
      onError("Pista: Multiplica 1,5 por 1000. Cuantos gramos hay en un kilo y medio? La magia se ha desestabilizado. Debes volver a empezar la zona desde el principio!");
    }
  }

  return (
    <div className="flex flex-col gap-5">
      <h2 className="text-2xl font-black text-cyan-200 text-center uppercase tracking-wide">Fase 2 — El Equilibrio de los Nenufares</h2>
      <div className="flex justify-center gap-6 flex-wrap items-center">
        <div className="border-2 border-cyan-600 bg-cyan-950/60 rounded-2xl px-8 py-5 text-center">
          <p className="text-cyan-400 text-lg uppercase tracking-widest">Rana Guardiana</p>
          <p className="text-5xl font-black text-white mt-1">1,5</p>
          <p className="text-cyan-400 text-lg">kilogramos</p>
        </div>
        <p className="text-4xl font-black text-cyan-500">=</p>
        <div className="border-2 border-cyan-600 bg-cyan-950/60 rounded-2xl px-8 py-5 text-center">
          <p className="text-cyan-400 text-lg uppercase tracking-widest">Semillas</p>
          <p className="text-5xl font-black text-cyan-300 mt-1">{val||"???"}</p>
          <p className="text-cyan-400 text-lg">gramos</p>
        </div>
      </div>
      <div className="flex gap-3">
        <input type="number" value={val} onChange={e=>setVal(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&comprobar()} disabled={done}
          placeholder="Escribe los gramos..."
          className="flex-1 bg-cyan-950/60 border-2 border-cyan-700 rounded-xl px-4 py-3 text-2xl text-white placeholder-cyan-700 outline-none focus:border-cyan-400 transition-colors disabled:opacity-50" />
        <button onClick={comprobar} disabled={done||!val}
          className="bg-cyan-700 hover:bg-cyan-600 disabled:opacity-40 disabled:cursor-default border-2 border-cyan-400 rounded-xl px-6 py-3 text-xl font-bold text-white transition-all active:scale-95">
          Equilibrar
        </button>
      </div>
      <FatimaDialog mensaje={fb.msg} tipo={fb.tipo} />
    </div>
  );
}

// ─── FASE 3 ───────────────────────────────────────────────────────────────────
function Fase3({ onComplete, onError }) {
  const [sel, setSel] = useState(null);
  const [fb, setFb] = useState({ msg: "Prepara el fertilizante. La receta exige un 75% de rocio de luna. Si el matraz esta dividido en cuartos, que fraccion debes llenar con rocio?", tipo: "intro" });
  const [done, setDone] = useState(false);
  const cuartos = { "1/4":1,"2/4":2,"3/4":3,"4/4":4 };

  function pick(op) {
    if (done) return;
    setSel(op);
    if (op === "3/4") {
      setFb({ msg: "Mezcla perfecta! El 75% es exactamente tres cuartas partes. Vamos al ultimo reto.", tipo: "acierto" });
      setDone(true);
      setTimeout(onComplete, 2200);
    } else {
      onError("El total es el 100% (4/4). Cada cuarto (1/4) representa un 25%. Suma cuartos hasta llegar a 75. La magia se ha desestabilizado. Debes volver a empezar la zona desde el principio!");
    }
  }

  const llenas = sel ? cuartos[sel] : 0;

  return (
    <div className="flex flex-col gap-5">
      <h2 className="text-2xl font-black text-cyan-200 text-center uppercase tracking-wide">Fase 3 — El Nectar al Cien por Cien</h2>
      <div className="flex justify-center">
        <div className="flex flex-col items-center gap-2">
          <p className="text-cyan-400 text-lg uppercase tracking-widest">Matraz</p>
          <div className="w-28 border-2 border-cyan-500 rounded-b-2xl overflow-hidden bg-cyan-950/60" style={{height:"160px"}}>
            {[4,3,2,1].map(p => (
              <div key={p} className={`border-b border-cyan-800 transition-colors duration-500`}
                style={{height:"25%", background: llenas>=p ? (done?"#10b981":"linear-gradient(to right,#3b82f6,#22d3ee)") : "transparent"}} />
            ))}
          </div>
          <p className="text-cyan-300 text-2xl font-black">{sel ? llenas*25+"%" : "0%"}</p>
        </div>
      </div>
      <div className="grid grid-cols-4 gap-3">
        {["1/4","2/4","3/4","4/4"].map(op => (
          <button key={op} onClick={()=>pick(op)} disabled={done}
            className={`py-5 rounded-2xl border-2 text-3xl font-black transition-all active:scale-95 disabled:cursor-default ${sel===op && done ? "border-emerald-400 bg-emerald-900/60 text-emerald-200" : sel===op ? "border-amber-400 bg-amber-950/60 text-amber-200" : "border-cyan-700 bg-cyan-950/50 text-cyan-100 hover:border-cyan-400 hover:bg-cyan-900/60"}`}>
            {op}
          </button>
        ))}
      </div>
      <FatimaDialog mensaje={fb.msg} tipo={fb.tipo} />
    </div>
  );
}

// ─── JARRA VISUAL ─────────────────────────────────────────────────────────────
function Jarra({ cap, contenido, label }) {
  const pct = (contenido / cap) * 100;
  const es4 = contenido === 4 && cap === 5;
  return (
    <div className="flex flex-col items-center gap-2">
      <p className="text-cyan-300 text-xl font-bold">{label}</p>
      <div className="relative w-20 border-2 border-cyan-500 rounded-b-2xl overflow-hidden bg-cyan-950/60"
        style={{height:"160px"}}>
        {Array.from({length:cap-1},(_,i)=>i+1).map(m => (
          <div key={m} className="absolute left-0 right-0 border-t border-cyan-700/40"
            style={{bottom:`${(m/cap)*100}%`}} />
        ))}
        <div className="absolute bottom-0 left-0 right-0 transition-all duration-500"
          style={{height:`${pct}%`, background: es4 ? "linear-gradient(to top,#059669,#6ee7b7)" : "linear-gradient(to top,#2563eb,#22d3ee)"}} />
      </div>
      <p className={`text-3xl font-black ${es4?"text-emerald-300":"text-cyan-200"}`}>{contenido} L</p>
      <p className="text-cyan-500 text-base">/ {cap} L</p>
    </div>
  );
}

// ─── FASE 4 ───────────────────────────────────────────────────────────────────
const SOLUCION = [
  { texto: "Paso 1: Llena la jarra de 5L desde la fuente.", j5:5, j3:0 },
  { texto: "Paso 2: Vierte agua de la jarra de 5L a la de 3L.", j5:2, j3:3 },
  { texto: "Paso 3: Vacia completamente la jarra de 3L.", j5:2, j3:0 },
  { texto: "Paso 4: Pasa los 2L que quedan en la de 5L a la de 3L.", j5:0, j3:2 },
  { texto: "Paso 5: Vuelve a llenar la jarra de 5L desde la fuente.", j5:5, j3:2 },
  { texto: "Paso 6: Vierte de la jarra de 5L a la de 3L (solo caben 1L mas). En la jarra de 5L quedan exactamente 4L.", j5:4, j3:3 },
];

function Fase4({ onComplete, onError }) {
  const [j5, setJ5] = useState(0);
  const [j3, setJ3] = useState(0);
  const [acciones, setAcciones] = useState(0);
  const [fb, setFb] = useState({ msg: "El Arbol Aureo necesita EXACTAMENTE 4 litros. Tienes una jarra de 5L y otra de 3L. Usa los controles para medir 4 litros exactos en la jarra grande.", tipo: "intro" });
  const [done, setDone] = useState(false);
  const [mostraSolucion, setMostraSolucion] = useState(false);
  const [pasoSolucion, setPasoSolucion] = useState(0);

  function accion(tipo) {
    if (done) return;
    let a = j5, b = j3;
    switch(tipo) {
      case "llenar5": a=5; break;
      case "llenar3": b=3; break;
      case "vaciar5": a=0; break;
      case "vaciar3": b=0; break;
      case "5a3": { const t=Math.min(a,3-b); a-=t; b+=t; break; }
      case "3a5": { const t=Math.min(b,5-a); a+=t; b-=t; break; }
    }
    setJ5(a); setJ3(b);
    setAcciones(n=>n+1);
    setFb({ msg: "Sigue manipulando las jarras para conseguir 4 litros exactos en la jarra grande.", tipo: "intro" });
  }

  function comprobar() {
    if (done) return;
    if (j5 === 4) {
      setFb({ msg: "Lo lograste! Has canalizado 4 litros exactos. El Arbol Aureo florece con fuerza.", tipo: "victoria" });
      setDone(true);
      setTimeout(onComplete, 2600);
    } else {
      const msg = acciones >= 10
        ? "No te rindas! Tienes que conseguir que en la jarra de 3L queden exactamente 2 litros antes de hacer el ultimo llenado en la de 5L. La magia se ha desestabilizado. Debes volver a empezar la zona desde el principio!"
        : "Las medidas no son correctas. Vacia las jarras y vuelve a intentarlo. La magia se ha desestabilizado. Debes volver a empezar la zona desde el principio!";
      onError(msg);
    }
  }

  function activarSolucion() {
    setJ5(0); setJ3(0); setAcciones(0); setPasoSolucion(0);
    setMostraSolucion(true);
    setFb({ msg: "La solucion tiene 6 pasos. Pulsa Siguiente paso para ir avanzando uno a uno.", tipo: "intro" });
  }

  function siguientePaso() {
    const paso = SOLUCION[pasoSolucion];
    if (!paso) return;
    setJ5(paso.j5); setJ3(paso.j3);
    setFb({ msg: paso.texto, tipo: "intro" });
    setPasoSolucion(n => n + 1);
  }

  const solucionTerminada = pasoSolucion >= SOLUCION.length;
  const controles = [
    {id:"llenar5",label:"Llenar 5L"},{id:"llenar3",label:"Llenar 3L"},
    {id:"vaciar5",label:"Vaciar 5L"},{id:"vaciar3",label:"Vaciar 3L"},
    {id:"5a3",label:"Pasar 5L a 3L"},{id:"3a5",label:"Pasar 3L a 5L"},
  ];

  return (
    <div className="flex flex-col gap-5">
      <h2 className="text-2xl font-black text-cyan-200 text-center uppercase tracking-wide">Fase 4 — Las Jarras de la Vida</h2>
      <div className="flex justify-center gap-14">
        <Jarra cap={5} contenido={j5} label="Jarra 5L" />
        <Jarra cap={3} contenido={j3} label="Jarra 3L" />
      </div>
      <p className="text-center text-cyan-500 text-lg">
        Acciones: <span className="text-cyan-300 font-bold">{acciones}</span>
        {acciones >= 10 && !done && !mostraSolucion && <span className="text-amber-400 ml-2">(Pista disponible)</span>}
      </p>

      {!mostraSolucion ? (
        <div className="flex flex-col gap-3">
          <div className="grid grid-cols-2 gap-3" style={{gridTemplateColumns:"1fr 1fr 1fr"}} >
            {controles.map(c => (
              <button key={c.id} onClick={()=>accion(c.id)} disabled={done}
                className="bg-cyan-950/50 border-2 border-cyan-700 hover:border-cyan-400 hover:bg-cyan-900/60 disabled:opacity-40 disabled:cursor-default rounded-xl py-3 px-2 text-xl font-semibold text-cyan-100 transition-all active:scale-95 text-center leading-tight">
                {c.label}
              </button>
            ))}
          </div>
          {!done && (
            <button onClick={activarSolucion}
              className="w-full bg-teal-800 hover:bg-teal-700 border-2 border-teal-500 rounded-xl py-3 text-xl font-bold text-teal-200 transition-all active:scale-95">
              Ver solucion paso a paso
            </button>
          )}
          <button onClick={comprobar} disabled={done}
            className="w-full bg-blue-700 hover:bg-blue-600 disabled:opacity-40 disabled:cursor-default border-2 border-blue-400 rounded-xl py-4 text-2xl font-black text-white transition-all active:scale-95"
            style={{boxShadow:"0 0 20px rgba(59,130,246,.4)"}}>
            Comprobar 4L
          </button>
        </div>
      ) : (
        <div className="flex flex-col gap-3">
          <div className="bg-cyan-950/60 border-2 border-teal-500 rounded-2xl p-4 flex flex-col gap-3">
            <p className="text-teal-300 text-lg font-bold uppercase tracking-widest text-center">
              Solucion guiada — Paso {Math.min(pasoSolucion,6)} de 6
            </p>
            <div className="w-full bg-cyan-900/60 rounded-full overflow-hidden" style={{height:"12px"}}>
              <div className="h-full rounded-full transition-all duration-500"
                style={{width:`${(pasoSolucion/6)*100}%`, background:"linear-gradient(to right,#14b8a6,#22d3ee)"}} />
            </div>
            {!solucionTerminada ? (
              <button onClick={siguientePaso}
                className="w-full bg-teal-700 hover:bg-teal-600 border-2 border-teal-400 rounded-xl py-4 text-2xl font-black text-white transition-all active:scale-95">
                Siguiente paso ({pasoSolucion+1} / 6)
              </button>
            ) : (
              <p className="text-center text-emerald-300 text-xl font-bold">Has completado todos los pasos. Pulsa Comprobar 4L para terminar.</p>
            )}
          </div>
          <button onClick={comprobar} disabled={done}
            className="w-full bg-blue-700 hover:bg-blue-600 disabled:opacity-40 disabled:cursor-default border-2 border-blue-400 rounded-xl py-4 text-2xl font-black text-white transition-all active:scale-95"
            style={{boxShadow:"0 0 20px rgba(59,130,246,.4)"}}>
            Comprobar 4L
          </button>
          {!done && (
            <button onClick={()=>{ setMostraSolucion(false); setJ5(0); setJ3(0); setAcciones(0); setFb({msg:"Vuelve a intentarlo por tu cuenta. Ya conoces la tecnica.",tipo:"intro"}); }}
              className="w-full bg-transparent border border-cyan-800 hover:border-cyan-600 rounded-xl py-3 text-lg text-cyan-500 hover:text-cyan-300 transition-all">
              Intentarlo yo solo
            </button>
          )}
        </div>
      )}
      <FatimaDialog mensaje={fb.msg} tipo={fb.tipo} />
    </div>
  );
}

// ─── VICTORIA ─────────────────────────────────────────────────────────────────
function Victoria({ onNavegar }) {
  return (
    <div className="flex flex-col items-center gap-8 py-6 text-center fade-in">
      <div className="border-2 border-cyan-400 bg-cyan-950/80 rounded-3xl px-8 py-10 w-full max-w-lg"
        style={{backdropFilter:"blur(12px)",boxShadow:"0 0 64px rgba(0,220,240,.3)"}}>
        <p className="text-cyan-400 text-xl uppercase tracking-widest mb-2">Estanque Conquistado</p>
        <h1 className="text-5xl font-black text-white leading-tight mb-4">
          El Jardin de Fibonacci<br/>
          <span className="text-cyan-300">te ha abierto sus puertas</span>
        </h1>
        <p className="text-cyan-200 text-xl leading-relaxed">
          Has dominado las fracciones, los decimales, los porcentajes y las medidas de capacidad.
        </p>
      </div>
      <div className="w-full max-w-lg">
        <FatimaDialog
          mensaje="Lo lograste! Has canalizado 4 litros exactos y el Arbol Aureo florece, dejando caer un antiguo pergamino entre sus ramas. Debemos leerlo con atencion para prepararnos para la Gran Prueba Final."
          tipo="victoria" />
      </div>
      <button onClick={onNavegar}
        className="bg-cyan-600 hover:bg-cyan-500 border-2 border-cyan-300 rounded-2xl px-12 py-5 text-2xl font-black text-white uppercase tracking-widest transition-all active:scale-95"
        style={{boxShadow:"0 0 32px rgba(0,220,240,.5)"}}>
        Desbloquear Pergamino Lector
      </button>
    </div>
  );
}

// ─── APP PRINCIPAL ────────────────────────────────────────────────────────────
function App() {
  const [fase, setFase] = useState(1);
  const [victoria, setVictoria] = useState(false);
  const [modalError, setModalError] = useState(null);
  const [resetKey, setResetKey] = useState(0);

  function handleError(msg) { setModalError(msg); }
  function handleReiniciar() { setModalError(null); setFase(1); setResetKey(k=>k+1); }

  return (
    <div className="min-h-screen text-white relative overflow-hidden" style={{fontFamily:"'Cinzel',serif"}}>

      {/* Fondo */}
      <div className="absolute inset-0 bg-cover bg-center bg-no-repeat"
        style={{backgroundImage:`url(${POND_BG})`}} />
      <div className="absolute inset-0 bg-cyan-950/72" />
      <div className="absolute inset-0 pointer-events-none"
        style={{background:"radial-gradient(ellipse 70% 55% at 50% 50%, transparent 0%, rgba(0,12,24,.5) 100%)"}} />

      {/* Anillos animados */}
      <div className="absolute inset-0 pointer-events-none overflow-hidden">
        {[0,1,2,3].map(i=>(
          <div key={i} className="absolute rounded-full"
            style={{
              width:`${280+i*200}px`, height:`${280+i*200}px`,
              top:"50%", left:"50%",
              border:"1px solid rgba(34,211,238,.08)",
              transform:"translate(-50%,-50%)",
              animation:`ripple ${5+i*1.8}s ease-in-out infinite`,
              animationDelay:`${i*1.4}s`
            }} />
        ))}
      </div>

      {/* Contenido */}
      <div className="relative z-10 max-w-2xl mx-auto px-4 py-8">
        {!victoria ? (
          <>
            <header className="text-center mb-6">
              <p className="text-cyan-400 text-base uppercase tracking-widest" style={{textShadow:"0 0 8px rgba(0,220,240,.7)"}}>
                Mundo — El Jardin de Fibonacci
              </p>
              <h1 className="text-4xl font-black text-white mt-1" style={{textShadow:"0 0 16px rgba(0,220,240,.5)"}}>
                El Estanque de la Proporcion
              </h1>
              <p className="text-cyan-300 text-xl mt-1">Fracciones, decimales, porcentajes y capacidades</p>
            </header>
            <div className="mb-6"><IndicadorFases faseActual={fase} /></div>
            <div key={resetKey} className="bg-cyan-950/70 border-2 border-cyan-400 rounded-3xl p-6"
              style={{backdropFilter:"blur(12px)",boxShadow:"0 8px 64px rgba(0,200,220,.2),inset 0 1px 0 rgba(0,220,240,.12)"}}>
              {fase===1 && <Fase1 onComplete={()=>setFase(2)} onError={handleError} />}
              {fase===2 && <Fase2 onComplete={()=>setFase(3)} onError={handleError} />}
              {fase===3 && <Fase3 onComplete={()=>setFase(4)} onError={handleError} />}
              {fase===4 && <Fase4 onComplete={()=>setVictoria(true)} onError={handleError} />}
            </div>
          </>
        ) : (
          <Victoria onNavegar={()=>alert("Navegando al Pergamino Lector...")} />
        )}
      </div>

      {modalError && <ModalError mensaje={modalError} onReiniciar={handleReiniciar} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
